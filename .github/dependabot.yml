version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    groups:
      safe-dependency-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Asia/Riyadh
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
