name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tahaddi?schema=public
      AUTH_SECRET: ci-only-playwright-secret
      AUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_URL: http://127.0.0.1:3000
      RUN_AUTH_E2E: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tahaddi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tahaddi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Verify production gate and decoded voice signal measurement
        run: node --test scripts/vercel-ci-gate.test.mjs scripts/voice-audio-signal.test.mjs

      - name: Test
        # Unit requests use fixed origins; runtime URLs remain set for browser tests.
        run: NEXTAUTH_URL= AUTH_URL= NEXT_PUBLIC_SITE_URL= pnpm test

      - name: Test deployment migration connection
        run: node --test scripts/deploy-migrations.test.mjs

      - name: Apply migrations to the test database
        run: pnpm db:migrate:deploy

      - name: Seed Playwright test data
        run: pnpm db:seed

      - name: Build web app
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:3001

      - name: Install Playwright Chromium
        run: pnpm --filter @tahaddi/web exec playwright install --with-deps chromium

      - name: Verify Tahaddi Live reference room against its standalone fixture
        working-directory: apps/web
        run: pnpm exec playwright test --config playwright.tahaddi-reference.config.ts

      - name: Verify Tahaddi Live surfaces against their standalone fixture
        working-directory: apps/web
        run: pnpm exec playwright test --config playwright.tahaddi-surfaces.config.ts

      - name: Playwright end-to-end tests
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Verify Sultan Farm and management against the local fixture
        working-directory: apps/web
        run: pnpm exec playwright test --config playwright.sultan-farm.config.ts

      - name: Verify market controls against the local fixture
        working-directory: apps/web
        run: pnpm exec playwright test --config playwright.visual-excellence.config.ts

      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-failures-${{ github.run_attempt }}
          path: apps/web/test-results/
          retention-days: 7

      - name: Verify public atlas opening on desktop and mobile
        working-directory: apps/web
        run: pnpm exec playwright test --config playwright.globe-scene.config.ts --grep 'public atlas opens'
