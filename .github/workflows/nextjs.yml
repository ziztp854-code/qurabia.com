name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs may be superseded; push runs still complete for the release gate.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep the protected check name until repository rules can be updated.
  voice-postgres:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/profile_test_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/profile_test_ci
      PROFILE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/profile_test_ci
      GAME_FAVORITES_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/favorites_test_ci
      COMMUNITY_VOICE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/community_voice_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: profile_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d profile_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare the isolated integration test databases
        # Use Prisma directly so an unreachable database fails this job.
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE favorites_test_ci' -c 'CREATE DATABASE community_voice_test'
          pnpm exec prisma migrate deploy
          DATABASE_URL="$GAME_FAVORITES_TEST_DATABASE_URL" DIRECT_URL="$GAME_FAVORITES_TEST_DATABASE_URL" pnpm exec prisma migrate deploy

      - name: Build shared packages for the integration runner
        run: pnpm exec turbo build --filter=@tahaddi/database --filter=@tahaddi/contracts --filter=@tahaddi/domain

      - name: Test profiles, favorites and community with PostgreSQL
        working-directory: apps/web
        run: |
          suites=(
            src/lib/profile/repository.database.integration.test.ts
            src/app/api/game-favorites/route.integration.test.ts
            src/lib/community/community.integration.test.ts
          )
          report="$RUNNER_TEMP/postgres-test-results.json"
          pnpm exec vitest run "${suites[@]}" --reporter=default --reporter=json --outputFile.json="$report"
          node - "$report" "${suites[@]}" <<'NODE'
          const [reportFile, ...suites] = process.argv.slice(2);
          const { testResults } = require(reportFile);
          for (const path of suites) {
            const suite = testResults.find(({ name }) => name.endsWith('/' + path));
            if (!suite?.assertionResults.some(({ status }) => status === 'passed'))
              throw new Error(`Required PostgreSQL suite did not run: ${path}`);
          }
          NODE

  validate-core:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tahaddi?schema=public
      AUTH_SECRET: ci-only-playwright-secret
      AUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_URL: http://127.0.0.1:3000
      RUN_AUTH_E2E: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tahaddi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tahaddi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Verify production release gates
        run: node --test scripts/production-ci-gate.test.mjs scripts/build-web-production.test.mjs

      - name: Test
        # Unit requests use fixed origins; runtime URLs remain set for browser tests.
        run: NEXTAUTH_URL= AUTH_URL= NEXT_PUBLIC_SITE_URL= pnpm test

      - name: Test deployment migration connection
        run: node --test scripts/deploy-migrations.test.mjs

      - name: Apply migrations to the test database
        run: pnpm db:migrate:deploy

      - name: Seed Playwright test data
        run: pnpm db:seed

      - name: Build web app
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:3001

      - name: Install Playwright Chromium
        run: pnpm --filter @tahaddi/web exec playwright install chromium

      - name: Verify profile, sign-in and Knowledge Tower against their standalone fixtures
        working-directory: apps/web
        run: pnpm exec playwright test --config playwright.tahaddi-surfaces.config.ts

      - name: Playwright end-to-end tests
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Verify market controls against the local fixture
        working-directory: apps/web
        run: pnpm exec playwright test --config playwright.visual-excellence.config.ts

      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-failures-${{ github.run_attempt }}
          path: apps/web/test-results/
          retention-days: 7

      - name: Verify public atlas opening on desktop and mobile
        working-directory: apps/web
        run: pnpm exec playwright test --config playwright.globe-scene.config.ts --grep 'public atlas opens'

  sultan-farm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages for the fixture
        run: pnpm exec turbo build --filter=@tahaddi/database --filter=@tahaddi/contracts --filter=@tahaddi/domain --filter=@mamluk/world-map-core --filter=@mamluk/maplibre-adapter

      - name: Install Playwright Chromium
        run: pnpm --filter @tahaddi/web exec playwright install chromium

      - name: Verify Sultan Farm and management against the local fixture
        working-directory: apps/web
        run: pnpm exec playwright test --config playwright.sultan-farm.config.ts

      - name: Preserve failed farm browser evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: farm-browser-failures-${{ github.run_attempt }}
          path: apps/web/test-results/sultan-farm/
          retention-days: 7

  # Keep the protected check name and fail closed on failed, skipped or cancelled jobs.
  validate:
    if: ${{ always() }}
    needs: [validate-core, sultan-farm]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to succeed
        env:
          CORE_RESULT: ${{ needs.validate-core.result }}
          FARM_RESULT: ${{ needs.sultan-farm.result }}
        run: |
          if [[ "$CORE_RESULT" != "success" || "$FARM_RESULT" != "success" ]]; then
            echo "Required validation failed: core=$CORE_RESULT farm=$FARM_RESULT"
            exit 1
          fi
          echo "Required validation passed"
