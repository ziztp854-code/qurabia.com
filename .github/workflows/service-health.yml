name: Service availability

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-availability
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TAHADDI_WEB_HEALTH_URL: ${{ secrets.TAHADDI_WEB_HEALTH_URL }}
      TAHADDI_REALTIME_HEALTH_URL: ${{ secrets.TAHADDI_REALTIME_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check configured services
        if: ${{ env.TAHADDI_WEB_HEALTH_URL != '' && env.TAHADDI_REALTIME_HEALTH_URL != '' }}
        run: node scripts/check-service-health.mjs
      - name: Report missing configuration
        if: ${{ env.TAHADDI_WEB_HEALTH_URL == '' || env.TAHADDI_REALTIME_HEALTH_URL == '' }}
        run: echo '::notice::Set both health URL repository secrets to enable scheduled checks.'
