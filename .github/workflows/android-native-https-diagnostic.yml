name: Diagnose native HTTPS origin
on:
  push:
    branches: [codex/android-native-v2]
    paths: ['.github/workflows/android-native-https-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect unauthenticated HTTPS canonical redirects
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, target): return None
          opener=urllib.request.build_opener(NoRedirect())
          allowed={'qurabia.com','www.qurabia.com','tahaddi-platform-realtime.vercel.app'}
          for path in ('/api/auth/session','/api/voice/rooms'):
              url='https://qurabia.com'+path
              for hop in range(5):
                  parsed=urllib.parse.urlsplit(url)
                  if parsed.scheme!='https' or parsed.hostname not in allowed or parsed.username or parsed.password or parsed.query or parsed.fragment:
                      raise ValueError('Unapproved redirect origin or URL shape')
                  request=urllib.request.Request(url,headers={'Accept':'application/json'},method='GET')
                  try: response=opener.open(request,timeout=25)
                  except urllib.error.HTTPError as error: response=error
                  with response:
                      status=response.status
                      location=response.headers.get('Location')
                      content_type=response.headers.get_content_type()
                      body=response.read(65537)
                  try: payload=json.loads(body)
                  except (ValueError,UnicodeDecodeError): payload=None
                  record={'origin':parsed.scheme+'://'+parsed.netloc,'path':parsed.path,'status':status,'content_type':content_type,'json_object':isinstance(payload,dict),'empty_object':payload=={},'keys':sorted(payload)[:20] if isinstance(payload,dict) else []}
                  target=location or (payload.get('redirect') if isinstance(payload,dict) else None)
                  if isinstance(target,str):
                      target=urllib.parse.urljoin(url,target)
                      public=urllib.parse.urlsplit(target)
                      record['redirect_origin']=public.scheme+'://'+public.netloc
                      record['redirect_path']=public.path
                  print(json.dumps(record),flush=True)
                  if status not in (301,302,303,307,308): break
                  if not isinstance(target,str): raise ValueError('Redirect has no target')
                  url=target
          PY
