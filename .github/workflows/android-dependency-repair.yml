name: Resolve contextual React type peers
on:
  push:
    branches: [codex/android-apk-ci]
    paths: ['.github/workflows/android-dependency-repair.yml']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.14.0'
      - run: npm install --global pnpm@11.26.0 --ignore-scripts
      - name: Install baseline lock and record actual declaration resolution
        shell: bash
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @tahaddi/web exec node -e 'const p=require("node:path");for(const m of ["next","@react-three/fiber"]){const dir=p.dirname(require.resolve(m+"/package.json"));console.log("BEFORE",m,require.resolve("@types/react/package.json",{paths:[dir]}))}console.log("BEFORE web",require.resolve("@types/react/package.json"))'
      - name: Declare the missing optional type peers and regenerate lock
        shell: bash
        run: |
          cat >> pnpm-workspace.yaml <<'YAML'
          # Keep React declaration resolution contextual in this mixed web/native workspace.
          packageExtensions:
            'next@16.3.8':
              peerDependencies:
                '@types/react': '*'
              peerDependenciesMeta:
                '@types/react':
                  optional: true
            '@react-three/fiber@9.7.0':
              peerDependencies:
                '@types/react': '*'
              peerDependenciesMeta:
                '@types/react':
                  optional: true
          YAML
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @tahaddi/web exec node -e 'const p=require("node:path");for(const m of ["next","@react-three/fiber"]){const dir=p.dirname(require.resolve(m+"/package.json"));console.log("AFTER",m,require.resolve("@types/react/package.json",{paths:[dir]}))}console.log("AFTER web",require.resolve("@types/react/package.json"))'
          pnpm --filter @tahaddi/mobile exec node -e 'console.log("AFTER mobile",require.resolve("@types/react/package.json"))'
          git diff --no-color --no-ext-diff -- pnpm-workspace.yaml pnpm-lock.yaml > mobile-dependency.patch
          echo BEGIN_MOBILE_DEPENDENCY_PATCH
          cat mobile-dependency.patch
          echo END_MOBILE_DEPENDENCY_PATCH
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contextual-react-types-patch
          path: mobile-dependency.patch
          if-no-files-found: error
