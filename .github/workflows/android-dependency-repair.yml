name: Resolve Android Expo dependency lock
on:
  push:
    branches: [codex/android-apk-ci]
    paths: ['.github/workflows/android-dependency-repair.yml']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.14.0'
      - run: npm install --global pnpm@11.26.0 --ignore-scripts
      - name: Resolve native compatibility from the original stable Expo lock
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 76306271b0574f91b9231eb2cdb0673ab1819928
          git show 76306271b0574f91b9231eb2cdb0673ab1819928:pnpm-lock.yaml > pnpm-lock.yaml
          git show 76306271b0574f91b9231eb2cdb0673ab1819928:apps/mobile/package.json > apps/mobile/package.json
          pnpm --filter @tahaddi/mobile add expo@57.0.23 react@19.2.3 react-native@0.86.3 react-native-safe-area-context@5.7.0 --save-exact --lockfile-only --ignore-scripts
          pnpm --filter @tahaddi/mobile add --save-dev @types/react@19.2.18 --save-exact --lockfile-only --ignore-scripts
          git diff --no-color --no-ext-diff -- apps/mobile/package.json pnpm-lock.yaml > mobile-dependency.patch
          echo BEGIN_MOBILE_DEPENDENCY_PATCH
          cat mobile-dependency.patch
          echo END_MOBILE_DEPENDENCY_PATCH
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mobile-expo-dependency-patch
          path: mobile-dependency.patch
          if-no-files-found: error
