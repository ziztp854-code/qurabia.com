name: Stop Android verification at saved checkpoint
on:
  push:
    branches: [docs/android-native-visual-evidence]
    paths: [.github/workflows/android-stop-current.yml]
permissions:
  actions: write
  contents: read
jobs:
  stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Cancel only the explicitly saved Android run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_status="$(gh api repos/ziztp854-code/qurabia.com/actions/runs/39731033805 --jq .status)"
          if test "$run_status" = completed; then
            echo "The saved run already completed; no cancellation needed."
          else
            gh api --method POST repos/ziztp854-code/qurabia.com/actions/runs/39731033805/cancel
            echo "Cancellation requested for run 39731033805."
          fi
