name: Native dependency preparation
on:
  push:
    branches: [codex/android-native-v2]
    paths: ['.github/workflows/android-native-dependencies.yml']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.14.0'
      - run: npm install --global pnpm@11.26.0 --ignore-scripts
      - run: pnpm --filter @tahaddi/mobile... install --lockfile-only --ignore-scripts
      - run: pnpm --filter @tahaddi/mobile... install --frozen-lockfile --ignore-scripts
      - name: Generate lockfile with the installed Expo map
        run: |
          pnpm --filter @tahaddi/mobile exec node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const file='package.json',pkg=JSON.parse(fs.readFileSync(file,'utf8'));
          const map=JSON.parse(fs.readFileSync(path.join(path.dirname(require.resolve('expo/package.json')),'bundledNativeModules.json'),'utf8'));
          for(const k of ['expo-secure-store','expo-crypto','expo-image']) {
            if(typeof map[k]!=='string')throw new Error('Missing Expo native map for '+k);
            pkg.dependencies[k]=map[k];
          }
          fs.writeFileSync(file,JSON.stringify(pkg,null,2)+'\n');
          console.log('INSTALLED_EXPO '+require('expo/package.json').version);
          console.log('EXPO_NATIVE_MAP '+JSON.stringify(Object.fromEntries(['expo-secure-store','expo-crypto','expo-image'].map(k=>[k,map[k]]))));
          NODE
          pnpm --filter @tahaddi/mobile... install --lockfile-only --ignore-scripts
          pnpm --filter @tahaddi/mobile... install --frozen-lockfile --ignore-scripts
          git diff --check
      - name: Relay exact generated files for reviewed commit
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          for(const path of ['apps/mobile/package.json','pnpm-lock.yaml']) {
            const text=fs.readFileSync(path,'utf8');
            const encoded=Buffer.from(text).toString('base64');
            for(let offset=0,index=0;offset<encoded.length;offset+=12000,index++)
              console.log('NATIVE_FILE '+JSON.stringify({path,index,chunk:encoded.slice(offset,offset+12000)}));
            console.log('NATIVE_FILE_END '+JSON.stringify({path,bytes:Buffer.byteLength(text),chunks:Math.ceil(encoded.length/12000)}));
          }
          NODE
