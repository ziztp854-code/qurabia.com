name: Native dependency preparation
on:
  push:
    branches: [codex/android-native-v2]
    paths: ['.github/workflows/android-native-dependencies.yml']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.14.0'
      - run: npm install --global pnpm@11.26.0 --ignore-scripts
      - run: pnpm --filter @tahaddi/mobile... install --frozen-lockfile --ignore-scripts
      - name: Build domain and check mobile TypeScript
        run: |
          pnpm --filter @tahaddi/mobile exec tsc -p ../../packages/domain/tsconfig.json
          pnpm --filter @tahaddi/mobile typecheck
      - name: Run native logic regressions
        working-directory: apps/mobile
        shell: bash
        run: |
          mapfile -d '' files < <(find src tests -name '*.test.ts' -print0)
          test "${#files[@]}" -gt 0
          pnpm exec tsx --test "${files[@]}"
      - name: Run smoke safety guards
        run: python3 -m unittest discover -s apps/mobile/tests -p 'test_*.py'
      - run: git diff --check
