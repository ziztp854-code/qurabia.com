name: Native dependency preparation
on:
  push:
    branches: [codex/android-native-v2]
    paths: ['.github/workflows/android-native-dependencies.yml']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.14.0'
      - run: npm install --global pnpm@11.26.0 --ignore-scripts
      - run: pnpm --filter @tahaddi/mobile... install --frozen-lockfile --ignore-scripts
      - name: Query exact compatible dependency versions
        run: |
          pnpm --filter @tahaddi/mobile exec node <<'NODE'
          const fs = require('node:fs'), path=require('node:path');
          const map = JSON.parse(fs.readFileSync(path.join(path.dirname(require.resolve('expo/package.json')), 'bundledNativeModules.json'),'utf8'));
          console.log('EXPO_NATIVE_MAP '+JSON.stringify(Object.fromEntries(['expo-secure-store','expo-crypto'].map(k=>[k,map[k]]))));
          NODE
          for spec in '@livekit/react-native@3.1.0' '@livekit/react-native-webrtc@150.1.0' 'livekit-client@2.23.0' '@livekit/react-native-expo-plugin@1.1.0' '@config-plugins/react-native-webrtc@latest' '@expo-google-fonts/cairo@0.4.1'; do
            npm view "$spec" version peerDependencies dependencies --json
          done
