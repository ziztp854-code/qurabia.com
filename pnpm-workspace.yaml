packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@sentry/cli': false
  '@swc/core': true
  cbor-extract: false
  'esbuild': true
  'prisma': true
  'sharp': true
  'unrs-resolver': true

overrides:
  'fast-uri@<3.1.6': 3.1.8
  'multer@<2.3.0': 2.3.0
  'mysql2@<3.23.1': 3.23.1
  'nanoid@<3.3.18': 3.3.18
  'nanoid@>=4.0.0 <5.1.16': 5.1.16
  postcss: 8.5.23
  'qs@<6.16.0': 6.16.0
  sharp: 0.35.4
  typescript: 5.9.3
  'undici@<7.29.0': 7.29.0
