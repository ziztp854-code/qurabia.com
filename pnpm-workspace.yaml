packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@sentry/cli': false
  '@swc/core': true
  cbor-extract: false
  'esbuild': true
  'prisma': true
  'sharp': true
  'unrs-resolver': true

minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/eslint-plugin-next@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - eslint-config-next@16.3.8
  - next@16.3.8
  - pixi.js@8.22.0

overrides:
  'engine.io@6.6.9': 6.6.10
  'fast-uri@<3.1.6': 3.1.8
  'multer@<2.5.0': 2.5.0
  'mysql2@<3.23.1': 3.23.1
  'nanoid@<3.3.18': 3.3.18
  'nanoid@>=4.0.0 <5.1.16': 5.1.16
  'piscina@4.9.3': 4.9.4
  postcss: 8.5.23
  'qs@<6.16.0': 6.16.0
  sharp: 0.35.5
  typescript: 5.9.3
  'undici@<7.30.1': 7.30.1
  'proxy-addr@<2.0.8': 2.0.8
  'shell-quote@>=1.8.4 <1.11.0': 1.11.0
  'brace-expansion@>=2.0.0 <2.1.6': 2.1.6
  'brace-expansion@>=5.0.0 <5.0.11': 5.0.11
  'devalue@>=5.0.0 <5.9.3': 5.9.3
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'compression@>=1.0.0 <1.8.2': 1.8.2
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'zod@>=4.0.0 <4.6.6': 4.6.6
  'http-cache-semantics@>=4.0.0 <4.3.0': 4.3.0
# Keep React declaration resolution contextual in this mixed web/native workspace.
packageExtensions:
  'next@16':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  '@react-three/fiber@9.7.0':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
