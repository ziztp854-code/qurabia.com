[package]
name = "tahaddi-desktop"
version = "0.1.0"
description = "Windows desktop shell for Tahaddi"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

